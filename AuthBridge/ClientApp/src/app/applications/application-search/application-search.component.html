<div class="search-page">
  <div class="search-header">
    <h1>Application Search</h1>
    <a routerLink="/home" class="back-link">&larr; Back to Home</a>
  </div>

  <div class="search-box">
    <input
      type="text"
      placeholder="Search..............."
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
    />
    <button type="button" class="btn-primary" (click)="onSearch()">Search</button>
  </div>

  <p class="assign-message" *ngIf="assignMessage">{{ assignMessage }}</p>

  <div class="tile-container">
    <div
      class="standard-tile"
      *ngFor="let app of applications"
      [class.selected]="isSelected(app.id)"
      (click)="toggleSelection(app.id)"
    >
      <div class="tile-top">
        <input
          type="checkbox"
          class="tile-checkbox"
          [checked]="isSelected(app.id)"
          (click)="$event.stopPropagation(); toggleSelection(app.id)"
        />
        <img *ngIf="app.iconUrl" [src]="app.iconUrl" alt="" class="tile-icon" />
        <div class="tile-icon placeholder" *ngIf="!app.iconUrl">{{ app.name.charAt(0) }}</div>

        <span class="tile-status" [class.inactive]="!app.isActive">{{ app.isActive ? 'Active' : 'Inactive' }}</span>
      </div>

      <h2 class="tile-title">{{ app.name }}</h2>
      <p class="tile-info">{{ app.description }}</p>
    </div>

    <p class="empty" *ngIf="applications.length === 0">No applications found.</p>
  </div>

  <div class="assign-bar" *ngIf="selectedApplicationIds.size > 0">
    <span class="assign-bar-count">{{ selectedApplicationIds.size }} application(s) selected</span>
    <input type="email" placeholder="user@example.com" [(ngModel)]="assignEmail" />
    <button type="button" class="btn-primary" [disabled]="!assignEmail || assigning" (click)="confirmAssign()">
      {{ assigning ? 'Assigning...' : 'Assign to User' }}
    </button>
    <button type="button" class="btn-link" (click)="clearSelection()">Clear</button>
    <p class="error" *ngIf="assignError">{{ assignError }}</p>
  </div>

</div>
