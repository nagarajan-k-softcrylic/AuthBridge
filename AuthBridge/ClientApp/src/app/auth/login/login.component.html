<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue to AuthBridge</p>

    <div class="auth-mode-switch" *ngIf="ssoEnabled && !mfaPending">
      <button type="button" [class.active]="authMode === 'basic'" (click)="switchMode('basic')">
        Basic Login
      </button>
      <button type="button" [class.active]="authMode === 'sso'" (click)="switchMode('sso')">
        SSO Login
      </button>
    </div>

    <form *ngIf="mfaPending" [formGroup]="mfaForm" (ngSubmit)="onMfaSubmit()">
      <div class="form-group">
        <label for="mfa-code">Authenticator Code</label>
        <input id="mfa-code" type="text" inputmode="numeric" formControlName="code" placeholder="123456" />
        <small class="error" *ngIf="mfaForm.get('code')?.touched && mfaForm.get('code')?.invalid">
          Enter the 6-digit code from your authenticator app.
        </small>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="rememberDevice" />
          Remember this device for 7 days
        </label>
      </div>

      <div class="error server-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="submitting">
        {{ submitting ? 'Verifying...' : 'Verify' }}
      </button>
    </form>

    <form *ngIf="!mfaPending && authMode === 'basic'" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          Password is required.
        </small>
      </div>

      <div class="error server-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="submitting">
        {{ submitting ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <form *ngIf="!mfaPending && authMode === 'sso'" class="sso-section" [formGroup]="ssoForm" (ngSubmit)="onSsoLogin()">
      <div class="form-group">
        <label for="sso-email">Email</label>
        <input id="sso-email" type="email" formControlName="email" placeholder="you@example.com" />
        <small class="error" *ngIf="ssoForm.get('email')?.touched && ssoForm.get('email')?.invalid">
          Enter a valid email address.
        </small>
      </div>

      <div class="error server-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary">
        Sign In
      </button>
    </form>

    <p class="switch-link" *ngIf="!mfaPending && authMode === 'basic'">
      Don't have an account? <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
