<div class="auth-page">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Sign up to get started with AuthBridge</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" formControlName="firstName" placeholder="John" />
          <small class="error" *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">
            Required.
          </small>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" formControlName="lastName" placeholder="Doe" />
          <small class="error" *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">
            Required.
          </small>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="At least 8 characters" />
        <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          Password must be at least 8 characters.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Re-enter password" />
        <small class="error" *ngIf="form.get('confirmPassword')?.touched && form.errors?.['passwordMismatch']">
          Passwords do not match.
        </small>
      </div>

      <div class="error server-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="submitting">
        {{ submitting ? 'Creating account...' : 'Sign Up' }}
      </button>
    </form>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
