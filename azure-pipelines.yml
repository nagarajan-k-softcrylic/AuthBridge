trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:
  - stage: Build
    jobs:
      - job: BuildAndTest
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET 9 SDK'
            inputs:
              packageType: 'sdk'
              version: '9.0.x'

          - task: NodeTool@0
            displayName: 'Use Node.js'
            inputs:
              versionSpec: '20.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: |
                AuthBridge/AuthBridge.csproj
                ScimProvisioning.Api/ScimProvisioning.Api.csproj

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: |
                AuthBridge/AuthBridge.csproj
                ScimProvisioning.Api/ScimProvisioning.Api.csproj
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Add/enable this once unit test projects exist in the solution.
          - task: DotNetCoreCLI@2
            displayName: 'Test'
            condition: false
            inputs:
              command: 'test'
              projects: '**/*Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build'

          - task: DotNetCoreCLI@2
            displayName: 'Publish AuthBridge'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'AuthBridge/AuthBridge.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/AuthBridge'
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: 'Publish ScimProvisioning.Api'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'ScimProvisioning.Api/ScimProvisioning.Api.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/ScimProvisioning.Api'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
